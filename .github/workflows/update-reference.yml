---
name: Update reference

on:
  schedule:
    - cron: '0 6 * * *' # runs daily at 6
  workflow_dispatch:

jobs:
  generate:
    name: Generate reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@v16
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Generate CLI reference
        run: scripts/src/generate-cli-reference.lua
      - name: Generate Lua API reference
        run: scripts/src/generate-lua-api-reference.lua
      - name: Generate schema reference
        run: scripts/src/generate-schema-reference.lua
      - name: Update Lux version references
        run: scripts/src/update-lux-version.lua
      - uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            docs/reference/cli.md
            docs/reference/lua-api.md
            docs/reference/config.md
            docs/reference/lux-toml.md
            static/schemas/config.schema.json
            static/schemas/lux-toml.schema.json
            docs/tutorial/09-ci-cd.md
          commit-message: "docs: update reference"
          title: "docs: update reference"
          body: |
            Automated update of the CLI, Lua API, schema, and version references.
          branch: update-reference
          delete-branch: true
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
